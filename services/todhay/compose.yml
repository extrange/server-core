services:
  todhay-backend:
    image: ghcr.io/cheeseecake/todhay@sha256:0d1affe121f25a0eaafb4b3a46661bf8d6451de5ffb2e42f25f7eeee91f6542d
    container_name: todhay-backend
    restart: always
    environment:
      DB_PATH: /data/db.sqlite3
      TZ: Asia/Singapore
      DEBUG: false
      ALLOWED_HOSTS: api.todhay.chanelng.com
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./data:/data
    networks:
      - todhay-backend
    labels:
      traefik.enable: true
      traefik.docker.network: core_todhay-backend
      traefik.http.routers.todhay-api.rule: Host(`api.todhay.chanelng.com`)
      # Required since this domain is not covered in traefik.yaml
      traefik.http.routers.todhay-api.tls.certresolver: leresolver

networks:
  todhay-backend:
