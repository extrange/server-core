services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release@sha256:151cdd6b5f2e21635645983e126f411675bfa35becb02c028c1a727f45f899c6
    container_name: karakeep
    restart: always
    volumes:
      - ./data/data:/data
    networks:
      - karakeep
    environment:
      BROWSER_WEBSOCKET_URL: ws://browserless:3000/chromium/playwright?token=${BROWSERLESS_TOKEN}
      BROWSER_CONNECT_ONDEMAND: true
      CRAWLER_NUM_WORKERS: 2
      DATA_DIR: /data
      DISABLE_SIGNUPS: true
      INFERENCE_CONTEXT_LENGTH: 512000
      INFERENCE_IMAGE_MODEL: "@preset/default"
      INFERENCE_TEXT_MODEL: "@preset/default"
      MEILI_ADDR: http://karakeep-meilisearch:7700
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://karakeep.nicholaslyz.com
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
    depends_on:
      - karakeep-meilisearch
      - browserless
    labels:
      traefik.enable: true
      traefik.docker.network: core_karakeep
      homepage.group: Services
      homepage.name: Karakeep
      homepage.icon: karakeep
      homepage.href: &url https://karakeep.nicholaslyz.com
      homepage.siteMonitor: *url
      homepage.widget.type: karakeep
      homepage.widget.url: *url
      homepage.widget.key: ${HOMEPAGE_KEY}

  karakeep-meilisearch:
    image: getmeili/meilisearch@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    container_name: karakeep-meilisearch
    restart: always
    command:
      - meilisearch
      - --upgrade-db
    networks:
      - karakeep
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - ./data/meilisearch:/meili_data

networks:
  karakeep:
