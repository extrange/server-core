services:
  loki:
    image: grafana/loki:latest@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: loki
    command: "-config.file=/config/loki.yml -target=all -log-config-reverse-order"
    restart: always
    networks:
      - loki
      - vector
    volumes:
      - "./loki.yml:/config/loki.yml"
      - "loki:/data" # Object store, we use a Docker volume instead of a disk mount as we don't want to snapshot logs
    user: root # https://github.com/grafana/loki/issues/5513
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loki:

networks:
  loki:
