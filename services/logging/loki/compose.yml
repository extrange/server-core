services:
  loki:
    image: grafana/loki:latest@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    command: "-config.file=/config/loki.yml -target=all -log-config-reverse-order"
    restart: always
    networks:
      - loki
      - vector
    volumes:
      - "./loki.yml:/config/loki.yml"
      - "loki:/data" # Object store, we use a Docker volume instead of a disk mount as we don't want to snapshot logs
    user: root # https://github.com/grafana/loki/issues/5513
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loki:

networks:
  loki:
