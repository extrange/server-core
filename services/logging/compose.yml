include:
  - grafana/compose.yml
  - loki/compose.yml
  - prometheus/compose.yml
  - vector/compose.yml

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: always
    networks:
      - cadvisor
    command:
      - "--housekeeping_interval=10s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    networks:
      - smartctl-exporter
    container_name: smartctl-exporter
    restart: always
    privileged: true
    user: root

  node-exporter:
    image: quay.io/prometheus/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: always
    network_mode: host
    pid: host # This mounts the hosts /proc and /sys on the container's /proc and /sys
    volumes:
      - "/:/rootfs:ro,rslave"
    command:
      - "--path.rootfs=/rootfs"
      - "--path.udev.data=/rootfs/run/udev/data"

networks:
  smartctl-exporter:
  cadvisor:
