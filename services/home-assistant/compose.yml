services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
    container_name: home-assistant
    restart: always
    depends_on:
      - mosquitto
      - frigate
    networks:
      home-assistant:
      macvlan:
        mac_address: 3a:bb:ab:31:7e:5c # Fixed MAC to prevent MAC address exhaustion on container restarts
        ipv4_address: 192.168.1.178
    volumes:
      - ./data/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      traefik.enable: true
      traefik.docker.network: core_home-assistant
      traefik.http.services.home-assistant.loadbalancer.server.port: 8123
      homepage.group: Services
      homepage.name: Home Assistant
      homepage.icon: home-assistant
      homepage.href: &url https://home-assistant.nicholaslyz.com
      homepage.siteMonitor: *url

  music-assistant:
    image: ghcr.io/music-assistant/server@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de
    container_name: music-assistant
    restart: always
    networks:
      home-assistant:
      macvlan:
        mac_address: B2:13:B2:C2:30:53 # Use a fixed MAC to prevent IP address exhaustion on container restarts
        ipv4_address: 192.168.1.80 # Static IP since Docker's macvlan driver doesn't support DHCP. TODO move to podman, which supports it
    volumes:
      - ./data/music-assistant:/data/
    labels:
      traefik.enable: true
      traefik.docker.network: core_home-assistant
      homepage.group: Services
      homepage.name: Music Assistant
      homepage.icon: music-assistant
      homepage.href: &url https://music-assistant.nicholaslyz.com
      homepage.siteMonitor: *url
    cap_add:
      - net_admin # Allow HA to discover devices on the network/obtain DHCP address

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt@sha256:fef0de769dcd04c27b3a6d277b61046eb96284bdd4198dcb1687c3a01b3020f3
    restart: always
    user: 1000:1000
    networks:
      - zigbee2mqtt
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      traefik.enable: true
      traefik.docker.network: core_zigbee2mqtt
      traefik.http.routers.zigbee2mqtt.rule: Host(`zigbee2mqtt.internal.nicholaslyz.com`)
      traefik.http.routers.zigbee2mqtt.entrypoints: tailscale
      homepage.group: Services
      homepage.name: Zigbee2MQTT
      homepage.icon: zigbee2mqtt
      homepage.href: https://zigbee2mqtt.internal.nicholaslyz.com
      homepage.siteMonitor: http://zigbee2mqtt:8080

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome@sha256:f6509fcf917a732fd80058567b237d5b9286b9dc6c8dde1b655fbb69ebd600ad
    volumes:
      - ./data/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      esphome:
      macvlan:
        mac_address: AE:48:AA:B8:7D:56 # Use a fixed MAC to prevent IP address exhaustion on container restarts
        ipv4_address: 192.168.1.81
    environment:
      ESPHOME_USERNAME: admin
      ESPHOME_PASSWORD: ${ESPHOME_PASSWORD}
    labels:
      traefik.enable: true
      traefik.http.routers.esphome.rule: Host(`esphome.internal.nicholaslyz.com`)
      traefik.http.routers.esphome.entrypoints: tailscale
      traefik.docker.network: core_esphome
      homepage.group: Services
      homepage.name: ESPHome
      homepage.icon: esphome
      homepage.href: &url https://esphome.internal.nicholaslyz.com
      homepage.siteMonitor: *url
    cap_add:
      - net_admin # Allow applying DHCP leases

  mosquitto:
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    container_name: mosquitto
    restart: always
    user: 1000:1000
    # We don't create a mosquitto network, as that would allow cross-communication between
    # containers that use mosquitto.
    networks:
      - zigbee2mqtt
      - home-assistant
      - frigate
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data

networks:
  home-assistant:
  macvlan:
    # Shared L2 network on the LAN, required for device discovery and Wake-on-LAN.
    # Docker permits each subnet only once, so all containers on the LAN share this network.
    driver: macvlan
    driver_opts:
      parent: enp5s0
    ipam:
      config:
        # No gateway, so containers' default routes stay on their Docker bridge networks
        - subnet: "192.168.1.0/24"
  esphome:
  zigbee2mqtt:
