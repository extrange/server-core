services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:6340a3de3917a9b19368e767310a96dd090f6a19aca8aeadf87fd1145cec9682
    container_name: home-assistant
    restart: always
    depends_on:
      - mosquitto
      - frigate
    post_start:
      - command: udhcpc -i eth1 -x hostname:home-assistant # Get a DHCP address for itself
        user: root
    networks:
      home-assistant:
      home-assistant-macvlan:
        mac_address: 3a:bb:ab:31:7e:5c # Use a fixed MAC to prevent IP address exhaustion on container restarts
    volumes:
      - ./data/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      traefik.enable: true
      traefik.docker.network: core_home-assistant
      traefik.http.services.home-assistant.loadbalancer.server.port: 8123
      homepage.group: Services
      homepage.name: Home Assistant
      homepage.icon: home-assistant
      homepage.href: &url https://home-assistant.nicholaslyz.com
      homepage.siteMonitor: *url
    cap_add:
      - net_admin # Allow HA to discover devices on the network

  music-assistant:
    image: ghcr.io/music-assistant/server@sha256:5ded610a2804fb7a973d2cbe390df09ceb67f0d7f603bcacd21ebaaa5a8a9b62
    container_name: music-assistant
    restart: always
    networks:
      home-assistant:
      music-assistant-macvlan:
        mac_address: B2:13:B2:C2:30:53 # Use a fixed MAC to prevent IP address exhaustion on container restarts
        ipv4_address: 192.168.1.80 # Static IP since Docker's macvlan driver doesn't support DHCP. TODO move to podman, which supports it
    volumes:
      - ./data/music-assistant:/data/
    labels:
      traefik.enable: true
      traefik.docker.network: core_home-assistant
      homepage.group: Services
      homepage.name: Music Assistant
      homepage.icon: music-assistant
      homepage.href: &url https://music-assistant.nicholaslyz.com
      homepage.siteMonitor: *url
    cap_add:
      - net_admin # Allow HA to discover devices on the network/obtain DHCP address

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
    restart: always
    user: 1000:1000
    networks:
      - zigbee2mqtt
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      traefik.enable: true
      traefik.docker.network: core_zigbee2mqtt
      traefik.http.routers.zigbee2mqtt.rule: Host(`zigbee2mqtt.internal.nicholaslyz.com`)
      traefik.http.routers.zigbee2mqtt.entrypoints: tailscale
      homepage.group: Services
      homepage.name: Zigbee2MQTT
      homepage.icon: zigbee2mqtt
      homepage.href: https://zigbee2mqtt.internal.nicholaslyz.com
      homepage.siteMonitor: http://zigbee2mqtt:8080

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome@sha256:e636269c6390c2124916510d45f55febb1d9ce41365f8445c9083ee41e43c92b
    volumes:
      - ./data/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    restart: always
    post_start:
      - command: /bin/bash -c 'apt-get update && apt-get install -y udhcpc && udhcpc -i eth1 -x hostname:esphome' # Get a DHCP address for itself
        user: root
    networks:
      esphome:
      esphome-macvlan:
        mac_address: AE:48:AA:B8:7D:56 # Use a fixed MAC to prevent IP address exhaustion on container restarts
    environment:
      ESPHOME_USERNAME: admin
      ESPHOME_PASSWORD: ${ESPHOME_PASSWORD}
    labels:
      traefik.enable: true
      traefik.http.routers.esphome.rule: Host(`esphome.internal.nicholaslyz.com`)
      traefik.http.routers.esphome.entrypoints: tailscale
      traefik.docker.network: core_esphome
      homepage.group: Services
      homepage.name: ESPHome
      homepage.icon: esphome
      homepage.href: &url https://esphome.internal.nicholaslyz.com
      homepage.siteMonitor: *url
    cap_add:
      - net_admin # Allow HA to discover devices on the network/obtain DHCP address

  mosquitto:
    image: eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    restart: always
    user: 1000:1000
    # We don't create a mosquitto network, as that would allow cross-communication between
    # containers that use mosquitto.
    networks:
      - zigbee2mqtt
      - home-assistant
      - frigate
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data

networks:
  home-assistant:
  home-assistant-macvlan:
    # Required for device discovery
    # ipvlan does not support DHCP
    driver: macvlan
    driver_opts:
      parent: enp5s0
  music-assistant-macvlan:
    driver: macvlan
    driver_opts:
      parent: enp5s0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          gateway: "192.168.1.1"
  esphome:
  esphome-macvlan:
    driver: macvlan
    driver_opts:
      parent: enp5s0

  zigbee2mqtt:
