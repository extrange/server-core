services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest@sha256:a88678c038b0e4340822b02a5efc566c56d8176b5bffa731bc433fd37f978e4c
    container_name: hindsight
    restart: always
    shm_size: 1g
    environment:
      TZ: Asia/Singapore
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_MODEL: "@preset/default"
      HINDSIGHT_API_WORKER_ID: hindsight
    volumes:
      - ./data/hindsight:/home/hindsight/.pg0
    networks:
      - hindsight
    labels:
      traefik.enable: true
      traefik.http.routers.hindsight.rule: Host(`hindsight.internal.nicholaslyz.com`)
      traefik.http.routers.hindsight.entrypoints: tailscale
      traefik.http.services.hindsight.loadbalancer.server.port: 9999
      traefik.docker.network: core_hindsight
      homepage.group: Services
      homepage.name: Hindsight
      homepage.icon: hindsight
      homepage.href: &url https://hindsight.internal.nicholaslyz.com
      homepage.siteMonitor: *url

  hermes-agent-xiaoyun:
    image: nousresearch/hermes-agent@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
    container_name: hermes-agent-xiaoyun
    restart: always
    command: gateway run
    depends_on:
      - hindsight
    networks:
      - hermes-agent-xiaoyun
      - open-webui
      - hindsight
      - camofox
    volumes:
      - ./data/xiaoyun:/opt/data
      - ./config.yaml:/opt/data/config.yaml
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_UID: 1000
      HERMES_GID: 1000
    labels:
      traefik.enable: true
      traefik.http.routers.hermes-agent-xiaoyun.rule: Host(`hermes-agent-xiaoyun.internal.nicholaslyz.com`)
      traefik.http.routers.hermes-agent-xiaoyun.entrypoints: tailscale
      traefik.http.services.hermes-agent-xiaoyun.loadbalancer.server.port: 9119
      traefik.docker.network: core_hermes-agent-xiaoyun
      homepage.group: Services
      homepage.name: Hermes Agent (Xiao Yun)
      homepage.icon: hermes-icon
      homepage.href: &url https://hermes-agent-xiaoyun.internal.nicholaslyz.com
      homepage.siteMonitor: *url

  camofox:
    image: ghcr.io/jo-inc/camofox-browser@sha256:cff2c1432b609bde9c9d0b91e5b924dae0799d3c7bc9d468c0bc949325beaf2a
    container_name: camofox
    restart: always
    shm_size: 2G
    volumes:
      - ./data/camofox:/root/.camofox
    networks:
      - camofox
    ports:
      - 6080:6080
    environment:
      MAX_OLD_SPACE_SIZE: 2048
      CAMOFOX_CRASH_REPORT_ENABLED: false
      ENABLE_VNC: 1
      VNC_BIND: 0.0.0.0
      CAMOFOX_LOCALE: en-SG
      CAMOFOX_TIMEZONE: Asia/Singapore
      SESSION_TIMEOUT_MS: 0
      BROWSER_IDLE_TIMEOUT_MS: 0
      TAB_INACTIVITY_MS: 0
    labels:
      traefik.enable: true
      traefik.http.routers.camofox.rule: Host(`camofox.internal.nicholaslyz.com`)
      traefik.http.routers.camofox.entrypoints: tailscale
      traefik.http.services.camofox.loadbalancer.server.port: 6080
      traefik.docker.network: core_camofox
      homepage.group: Services
      homepage.name: Camofox (Hermes Agent)
      homepage.icon: firefox
      homepage.href: &url https://camofox.internal.nicholaslyz.com/vnc.html
      homepage.siteMonitor: *url

networks:
  hindsight:
  hermes-agent-xiaoyun:
  camofox:
