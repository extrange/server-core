model:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions
  default: &default_model deepseek/deepseek-v4-flash-0731
fallback_providers:
  - provider: openrouter
    model: *default_model
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
cron:
  model: *default_model
  model_provider: openrouter
auxiliary:
  vision:
    provider: openrouter
    model: openai/gpt-5.6-luna
provider_routing:
  only:
    - deepseek
    - baidu/fp8
web:
  search_backend: tavily
  extract_backend: tavily
checkpoints:
  delete_orphans: true
display:
  memory_notifications: false
  busy_input_mode: steer
  show_reasoning: false
  streaming: true
  tool_progress: false
  cleanup_progress: true
stt:
  provider: openai
  openai:
    model: gpt-transcribe
memory:
  provider: hindsight
timezone: Asia/Singapore
whatsapp:
  require_mention: false
  extra:
    group_policy: allowlist
    group_allow_from:
      - 6598795366-1372771767@g.us
      - 120363422641179682@g.us
      - 120363410218408492@g.us
telegram:
  require_mention: false
  extra:
    rich_messages: true
command_allowlist:
  - script execution via heredoc
  - script execution via -e/-c flag
streaming:
  enabled: true
group_sessions_per_user: false
platform_toolsets:
  telegram:
    - hermes-cli
  whatsapp:
    - hermes-cli
image_gen:
  provider: openai
  use_gateway: false
  model: gpt-image-2-medium
platforms:
  whatsapp:
    enabled: true
_config_version: 38
onboarding:
  seen:
    busy_input_prompt: true
agent: {}
