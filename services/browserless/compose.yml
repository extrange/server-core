services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:f04924f64aec5fcfc35226433d76b749068398b2abf548b2ee8c2c93c0d11e45
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
