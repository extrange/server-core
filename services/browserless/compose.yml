services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:f16b2e20455d0ed179d659d56be98ae4f55eed0e3b80254cdc3bf52f1d6d8384
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
