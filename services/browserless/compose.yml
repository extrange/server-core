services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:c62cf104709509191ca78e2b3d9232528fabc93a6dbb37cbadd511886324b657
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
