services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:f20eb77a1f760769a573446c25651e8f85ff9f40439f43bd591926935d57a2d3
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
