services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:a631d6fcf9da17b5ff34f2a405e84a528659c1dce748cc87f741bc6220b54ffb
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
