services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:7baa6a4966cb8e1b0249a50173fdc6ed82e36169031548bf49061f273a583113
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - karakeep
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
