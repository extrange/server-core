services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:fff5f5bf6d048dd8d9f18a635ae4efcfcf4026a5ddd8815ae7659e619c98acee
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - karakeep
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
