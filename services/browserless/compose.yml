services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:b24f29a97ab3348ab560e266887edeca4be1ba70ae1df080a4f999bde7e995e0
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - karakeep
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
