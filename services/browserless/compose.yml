services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:dcf0df275fdea6ed2fe9d89fdf090e5770d2e9f5105fa5fdfa24c028bdb6a6a8
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - karakeep
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
