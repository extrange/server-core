services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:50edafe9b66376e02ea4aaef75c540700b3e13a1ed3bf1a268fd8487e8c0c97f
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - karakeep
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
