services:
  browserless:
    container_name: browserless
    image: ghcr.io/browserless/chromium@sha256:c0aaefc21970565d9088913eebbfd27e0d117c7bded72928bfed6699427554b3
    restart: always
    environment:
      TZ: Asia/Singapore
      TOKEN: ${BROWSERLESS_TOKEN}

      # The following are necessary for link previews to work
      CORS: true
    networks:
      - changedetection-io
      - karakeep
      - reactive-resume
      - open-webui

      # External
      - polythought

networks:
  polythought:
    external: true
    name: polythought_polythought
