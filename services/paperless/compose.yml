services:
  paperless-redis:
    image: docker.io/library/redis:8@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    restart: always
    volumes:
      - paperless-redis:/data
    networks:
      - paperless
  paperless-db:
    image: docker.io/library/postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: always
    volumes:
      - ./data/postgresql:/var/lib/postgresql
    networks:
      - paperless
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
    restart: always
    depends_on:
      - paperless-redis
      - paperless-db
      - paperless-gotenberg
      - paperless-tika
    networks:
      - paperless
    volumes:
      - ./data/paperless:/usr/src/paperless/data
      - /mnt/storage/Documents:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - /mnt/storage/Incoming Scans:/usr/src/paperless/consume
    environment:
      DEBUG: true
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_URL: https://paperless.nicholaslyz.com
    labels:
      traefik.enable: true
      traefik.docker.network: core_paperless
      homepage.group: Services
      homepage.name: Paperless
      homepage.icon: paperless-ngx
      homepage.href: &url https://paperless.nicholaslyz.com
      homepage.siteMonitor: *url
  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.35@sha256:a16a14e1f18a71405624bc028e90d4ef50ea774c352b303639c10bf7b141f760
    restart: always
    # The gotenberg chromium route is used to convert .eml files. We do not want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless
  paperless-tika:
    image: docker.io/apache/tika:latest@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    restart: always
    networks:
      - paperless

volumes:
  paperless-redis:

networks:
  paperless:
