services:
  yamtrack:
    container_name: yamtrack
    image: ghcr.io/fuzzygrim/yamtrack:0.26.3@sha256:78497b454b2b52d3b1062f6fd238351d714cff0895db4369e49ace36f4622e75
    restart: always
    depends_on:
      yamtrack-redis:
        condition: service_started
    environment:
      TZ: Asia/Singapore
      PUID: 1000
      PGID: 1000
      SECRET: ${YAMTRACK_SECRET}
      URLS: https://yamtrack.nicholaslyz.com
      REGISTRATION: false
      REDIS_URL: redis://yamtrack-redis:6379
    volumes:
      - ./data/db:/yamtrack/db
    networks:
      - yamtrack
    labels:
      traefik.enable: true
      traefik.docker.network: core_yamtrack
      homepage.group: Services
      homepage.name: Yamtrack
      homepage.icon: yamtrack
      homepage.href: &url https://yamtrack.nicholaslyz.com
      homepage.siteMonitor: *url

  yamtrack-redis:
    container_name: yamtrack-redis
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: always
    networks:
      - yamtrack
    volumes:
      - ./data/redis:/data

networks:
  yamtrack:
