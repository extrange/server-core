services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda@sha256:79794e7881eea7c936f98f812c334d8d258b70d275785a9ef84e1472804a30d1
    container_name: open-webui
    restart: always
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      CUSTOM_NAME: AI Chat
      ENABLE_OLLAMA_API: false
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      USER_AGENT: Mozilla/5.0 (X11; Linux x86_64; rv:153.0) Gecko/20100101 Firefox/153.0 # For fetch_url tool (affects the default loader only)
    networks:
      - open-webui
    devices:
      - nvidia.com/gpu=all
    labels:
      traefik.enable: true
      traefik.docker.network: core_open-webui
      homepage.group: Services
      homepage.name: Open WebUI
      homepage.icon: open-webui
      homepage.href: &url https://open-webui.nicholaslyz.com
      homepage.siteMonitor: *url

  # paddleocr-vl-api:
  #   image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:latest-nvidia-gpu
  #   command: >
  #     paddlex --serve
  #     --pipeline PaddleOCR-VL-1.6
  #     --host 0.0.0.0
  #     --port 8080
  #   networks:
  #     - open-webui
  #   devices:
  #     - nvidia.com/gpu=all
  #   restart: unless-stopped

  mineru-api:
    build: .
    image: open-webui-mineru:local
    pull_policy: never
    container_name: mineru-api
    restart: always
    environment:
      MINERU_MODEL_SOURCE: local
    networks:
      - open-webui
    entrypoint: ["mineru-kit"]
    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Keep "standard": it is the server capability tier that exposes
      # flash/basic/standard/advanced. "advanced" itself is not a valid
      # api-server --tier value; it is requested per job by Open WebUI.
      - --tier
      - standard
      - --concurrency
      - "1"
      # Load the hybrid + VLM models at startup instead of the first request.
      - --preload-models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    devices:
      - nvidia.com/gpu=all

networks:
  open-webui:
